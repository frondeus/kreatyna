# Source of truth for the Xcode project. Agents edit this file; nobody edits
# the generated Kreatyna.xcodeproj (E-13). Regenerate it with `apple-generate`.
# XcodeGen reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: Kreatyna

options:
  # No XcodeGen default settings: every setting below is explicit, copied from
  # the project Xcode 26 created (MAC-10).
  settingPresets: none
  developmentLanguage: en

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MTL_FAST_MATH: YES
    SDKROOT: iphoneos
    # The Rust library is built for Apple Silicon simulators only
    # (aarch64-apple-ios-sim); Release would otherwise also build for Intel.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  configs:
    Debug:
      # Selects the Rust library profile in target/<rust-target>/<profile>/.
      RUST_PROFILE: debug
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      RUST_PROFILE: release
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

settingGroups:
  # Shared by the three Mac targets. The project-level settings above are for
  # iOS; this group overrides the SDK (MAC-00).
  macOS:
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "26.2"
    CODE_SIGN_STYLE: Automatic
    # Sign to Run Locally: this Mac has no Apple developer certificate.
    CODE_SIGN_IDENTITY: "-"
    # Only notarisation needs the hardened runtime. With ad-hoc signing it
    # stops the test bundle from loading into the app ("different Team IDs").
    ENABLE_HARDENED_RUNTIME: NO
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_VERSION: "5.0"

targets:
  Kreatyna:
    type: application
    platform: iOS
    sources:
      - path: Kreatyna
        type: syncedFolder
      # Generated by `ios-bindings`; never edit it.
      - path: ../../target/generated/apple/swift/kreatyna_ffi.swift
        optional: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: pl.frondeus.Kreatyna
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Rust core: the bindings are the same for every SDK and profile; the
        # static library is per SDK (device or simulator) and per profile.
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../target/generated/apple/swift/kreatyna_ffiFFI.h
        OTHER_LDFLAGS[sdk=iphonesimulator*]:
          - $(inherited)
          - $(SRCROOT)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE)/libkreatyna_ffi.a
          - -lsqlite3
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - $(inherited)
          - $(SRCROOT)/../../target/aarch64-apple-ios/$(RUST_PROFILE)/libkreatyna_ffi.a
          - -lsqlite3
    scheme:
      testTargets:
        - name: KreatynaTests
          parallelizable: true
        - name: KreatynaUITests
          parallelizable: true

  KreatynaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KreatynaTests
        type: syncedFolder
    dependencies:
      - target: Kreatyna
      - package: SnapshotTesting
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.2"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: pl.frondeus.KreatynaTests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kreatyna.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kreatyna

  KreatynaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KreatynaUITests
        type: syncedFolder
    dependencies:
      - target: Kreatyna
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: pl.frondeus.KreatynaUITests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Kreatyna

  KreatynaMac:
    type: application
    platform: macOS
    sources:
      - path: KreatynaMac
        type: syncedFolder
    settings:
      groups: [macOS]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        # The same identifier as the iOS app (MAC-00/Q2). The sandbox
        # container is ~/Library/Containers/pl.frondeus.Kreatyna/Data.
        PRODUCT_BUNDLE_IDENTIFIER: pl.frondeus.Kreatyna
        # The menu bar and Finder show "Kreatyna".
        PRODUCT_NAME: Kreatyna
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - name: KreatynaMacTests
          parallelizable: true
        - name: KreatynaMacUITests
          parallelizable: true

  KreatynaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KreatynaMacTests
        type: syncedFolder
    dependencies:
      - target: KreatynaMac
    settings:
      groups: [macOS]
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: pl.frondeus.KreatynaMacTests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kreatyna.app/Contents/MacOS/Kreatyna

  KreatynaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KreatynaMacUITests
        type: syncedFolder
    dependencies:
      - target: KreatynaMac
    settings:
      groups: [macOS]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.frondeus.KreatynaMacUITests
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_TARGET_NAME: KreatynaMac
