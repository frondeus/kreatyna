[package]
name = "kreatyna-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
kreatyna = { path = "../kreatyna" }
kreatyna-db = { path = "../kreatyna-db" }
krucyfiks = { path = "../../../krucyfiks/core" }
krucyfiks-runtime = { path = "../../../krucyfiks/runtime" }

uniffi = "0.32.1"
parking_lot = "0.12.5"
async-trait = "0.1.92"
futures = "0.3.34"
thiserror = "2.0.20"
flume = "0.12.0"
diesel = { version = "~2.3.9", features = ["sqlite"] }
diesel-async = { version = "0.9.2", features = ["sqlite"] }
diesel_migrations = "~2.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
test-case = "3"
