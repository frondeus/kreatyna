[package]
name = "mausritter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
uniffi = "0.32.1"
mausritter_core = { package = "core", path = "../core" }
parking_lot = "0.12.5"
async-trait = "0.1.92"
futures = "0.3.34"
thiserror = "2.0.20"
flume = "0.12.0"
diesel = { version = "~2.3.9", features = ["sqlite"] }
diesel-async = { version = "0.9.2", features = ["sqlite"] }
diesel_migrations = "~2.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
